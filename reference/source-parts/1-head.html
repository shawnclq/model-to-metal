<title>Model to Metal</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Stencil+One&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: Kube Harbor's sibling. Mission panel left, a live chip / kernel simulator and a terminal right, home page lists worlds as piers. */
:root{
  --paper:#E6EDE9; --panel:#F6F9F7; --panel-2:#EDF3F0; --ink:#10263A; --muted:#546877; --rule:#C2CFCA;
  --grid:rgba(29,92,136,.07); --sea:#1D5C88; --sea-ink:#FFFFFF; --signal:#E1A100; --signal-ink:#10263A;
  --ok:#2A8A5D; --warn:#B97A00; --bad:#C23D2A; --idle:#8C9CA6;
  --term:#0A1720; --term-ink:#CFE2DA; --term-dim:#6D8894; --term-ok:#6FD3A1; --term-err:#FF8A76; --term-acc:#F2C12E;
  --pkg:#CBD8D1; --pkg-edge:#A9BBB2; --die:#173246; --die-edge:#0E2232; --sm-off:#29475D; --sm-dis:#1B3345; --sm-on:#F2C12E;
  --hbm:#5F7584; --hbm-fill:#1D5C88; --lane:#1D5C88;
  --kv:#E1A100; --wt:#1D5C88; --rsv:#8C9CA6;
  --shadow:0 1px 0 rgba(16,38,58,.05),0 10px 26px -16px rgba(16,38,58,.35);
  --display:"Saira Stencil One","Impact","Arial Narrow",sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#0B1620; --panel:#112231; --panel-2:#0E1C28; --ink:#E2EBE8; --muted:#8FA3B0; --rule:#23394B;
    --grid:rgba(90,166,218,.06); --sea:#5AA6DA; --sea-ink:#06121A; --signal:#F2C12E; --signal-ink:#10202B;
    --ok:#47BE85; --warn:#E3AE3A; --bad:#EE6A54; --idle:#62788A;
    --term:#050D13; --shadow:0 1px 0 rgba(0,0,0,.3),0 12px 28px -16px rgba(0,0,0,.7);
    --pkg:#1A2E3D; --pkg-edge:#2A4458; --die:#0A1924; --die-edge:#3A5A72; --sm-off:#1E3A4F; --sm-dis:#122634; --sm-on:#F2C12E;
    --hbm:#4C6577; --hbm-fill:#5AA6DA; --lane:#5AA6DA; --kv:#F2C12E; --wt:#5AA6DA; --rsv:#62788A;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#0B1620; --panel:#112231; --panel-2:#0E1C28; --ink:#E2EBE8; --muted:#8FA3B0; --rule:#23394B;
  --grid:rgba(90,166,218,.06); --sea:#5AA6DA; --sea-ink:#06121A; --signal:#F2C12E; --signal-ink:#10202B;
  --ok:#47BE85; --warn:#E3AE3A; --bad:#EE6A54; --idle:#62788A;
  --term:#050D13; --shadow:0 1px 0 rgba(0,0,0,.3),0 12px 28px -16px rgba(0,0,0,.7);
  --pkg:#1A2E3D; --pkg-edge:#2A4458; --die:#0A1924; --die-edge:#3A5A72; --sm-off:#1E3A4F; --sm-dis:#122634; --sm-on:#F2C12E;
  --hbm:#4C6577; --hbm-fill:#5AA6DA; --lane:#5AA6DA; --kv:#F2C12E; --wt:#5AA6DA; --rsv:#62788A;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:44px 44px;color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--paper)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
code,kbd{font-family:var(--mono);font-size:.86em;background:var(--panel-2);border:1px solid var(--rule);border-radius:4px;padding:.05em .35em;white-space:nowrap}
.wrap{max-width:1320px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--rule)}
.top .wrap{display:flex;align-items:center;gap:12px;min-height:54px;flex-wrap:wrap;padding-block:6px}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;text-align:left}
.brand svg{flex:none;color:var(--sea)}
.brand b{font-family:var(--display);font-weight:400;font-size:22px;letter-spacing:.04em;line-height:1}
.top .spacer{flex:1}
.xp{font-family:var(--mono);font-size:12px;color:var(--muted);display:flex;gap:10px;align-items:center;font-variant-numeric:tabular-nums}
.xp strong{color:var(--ink);font-weight:600}
.btn{border:1px solid var(--rule);background:var(--panel);border-radius:6px;padding:7px 12px;font-size:14px;line-height:1.2}
.btn:hover{border-color:var(--sea)}
.btn.primary{background:var(--sea);color:var(--sea-ink);border-color:var(--sea);font-weight:700}
.btn.signal{background:var(--signal);color:var(--signal-ink);border-color:var(--signal);font-weight:700}
.btn.ghost{background:transparent}
.mathbtn{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:12px}
.mathbtn i{width:28px;height:16px;border-radius:9px;background:var(--rule);position:relative;flex:none;transition:background .2s}
.mathbtn i::after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:var(--panel);transition:transform .2s}
.mathbtn[aria-pressed="true"] i{background:var(--sea)}
.mathbtn[aria-pressed="true"] i::after{transform:translateX(12px)}

/* home */
.hero{padding-block:36px 22px;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:28px;align-items:center}
.hero h1{font-family:var(--display);font-weight:400;font-size:clamp(44px,8.4vw,88px);line-height:.9;margin:0;letter-spacing:.01em;text-wrap:balance}
.hero h1 span{color:var(--sea)}
.hero p.lede{font-size:18px;max-width:34em;margin:16px 0 0}
.hero .cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
.hero .sub{font-size:13px;color:var(--muted);margin-top:12px;max-width:40em}
.demo{background:var(--term);color:var(--term-ink);font-family:var(--mono);font-size:12px;border-radius:10px;padding:16px;box-shadow:var(--shadow);overflow-x:auto;line-height:1.55;margin:0;min-width:0}
.demo .d{color:var(--term-dim)} .demo .o{color:var(--term-ok)} .demo .e{color:var(--term-err)} .demo .a{color:var(--term-acc)}
.pier{padding-block:14px}
.pier-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:6px;margin-bottom:14px}
.pier-head h2{font-family:var(--display);font-weight:400;font-size:28px;margin:0;letter-spacing:.02em}
.pier-head p{margin:0;color:var(--muted);font-size:14px}
.levels{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.lvl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:start;text-align:left;background:var(--panel);border:1px solid var(--rule);border-radius:8px;padding:12px 14px;box-shadow:var(--shadow);min-height:92px;position:relative}
.lvl:hover{border-color:var(--sea)}
.lvl .n{font-family:var(--display);font-size:30px;line-height:1;color:var(--sea);grid-row:span 3;min-width:1.4em}
.lvl .t{font-weight:700;font-size:15px;line-height:1.25}
.lvl .c{font-size:12.5px;color:var(--muted)}
.lvl .stars{font-size:13px;letter-spacing:2px;color:var(--signal)}
.lvl .stars .off{color:var(--rule)}
.lvl.next{border-color:var(--signal);box-shadow:0 0 0 2px color-mix(in srgb,var(--signal) 45%,transparent),var(--shadow)}
.lvl .badge{position:absolute;top:-9px;right:10px;font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;background:var(--signal);color:var(--signal-ink);padding:2px 6px;border-radius:3px}
.lvl.soon{cursor:default;box-shadow:none;background:transparent;border-style:dashed}
.lvl.soon:hover{border-color:var(--rule)}
.lvl.soon .n{color:var(--idle)}
.lvl.lab .n{color:var(--signal)}
.stackmap{display:grid;gap:4px;max-width:760px}
.stackmap div{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:center;padding:6px 10px;border:1px solid var(--rule);border-radius:6px;background:var(--panel);font-size:14px}
.stackmap .num{font-family:var(--mono);font-size:12px;color:var(--muted)}
.stackmap .w{font-family:var(--mono);font-size:11px;color:var(--muted);white-space:nowrap}
.stackmap div.here{border-color:var(--sea);background:color-mix(in srgb,var(--sea) 10%,var(--panel))}
.stackmap div.here .w{color:var(--sea);font-weight:600}
.stackmap div.part .w{color:var(--warn)}
.foot{color:var(--muted);font-size:13px;padding-block:22px 40px;display:flex;gap:16px;flex-wrap:wrap;justify-content:space-between;align-items:center}
.foot span:first-child{max-width:70ch}

/* game */
.game{display:grid;grid-template-columns:minmax(260px,340px) minmax(0,1fr);gap:16px;padding-block:16px 24px}
.mission{background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:16px;box-shadow:var(--shadow);align-self:start;position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px);max-height:calc(100vh - 90px);overflow:auto}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.mission h2{font-family:var(--display);font-weight:400;font-size:30px;line-height:1;margin:6px 0 8px;text-wrap:balance}
.tag{display:inline-block;font-size:12px;font-weight:700;background:var(--panel-2);border:1px solid var(--rule);border-radius:999px;padding:2px 10px}
.brief{font-size:14.5px;margin-top:10px}
.brief p{margin:0 0 .6em}
.lbl{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px;font-weight:600}
.goals{list-style:none;padding:0;margin:0;display:grid;gap:6px}
.goals li{display:grid;grid-template-columns:20px 1fr;gap:8px;font-size:14px;align-items:start}
.goals li::before{content:"";width:16px;height:16px;border:2px solid var(--idle);border-radius:3px;margin-top:2px}
.goals li.ok::before{background:var(--ok);border-color:var(--ok);box-shadow:inset 0 0 0 2px var(--panel)}
.goals li.ok{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--ok)}
.hints{margin:8px 0 0;padding-left:20px;font-size:14px;display:grid;gap:6px}
.answer{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.answer code{white-space:normal;word-break:break-word}
.m-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;padding-top:12px;border-top:1px dashed var(--rule)}
.manual{margin-top:12px;font-size:13px}
.manual h4{margin:10px 0 4px;font-size:12px;font-family:var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.manual button{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px dotted var(--rule);padding:4px 0;font-family:var(--mono);font-size:12px;color:var(--ink)}
.manual button:hover{color:var(--sea)}
.manual button span{color:var(--muted);font-family:var(--body);font-size:12px;margin-left:6px}

.deck{display:grid;gap:14px;min-width:0;align-content:start}
.map{background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:14px;box-shadow:var(--shadow);min-width:0}
.map-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.map-head h3{margin:0;font-family:var(--display);font-weight:400;font-size:20px;letter-spacing:.03em}
.map-cap{margin:-4px 0 12px;font-size:13px;color:var(--muted);max-width:75ch}

/* stack strip */
.stripcard{padding:10px 14px}
.strip{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.strip .lead{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-right:6px}
.strip button{font-family:var(--mono);font-size:11px;border:1px solid var(--rule);background:var(--panel-2);border-radius:4px;padding:3px 7px;color:var(--muted);line-height:1.3}
.strip button.on{background:var(--sea);color:var(--sea-ink);border-color:var(--sea);font-weight:600}
.strip button.near{border-color:var(--sea);color:var(--sea)}
.strip button.sel{box-shadow:0 0 0 2px var(--signal)}
.strip-note{font-size:13.5px;color:var(--ink);margin-top:8px;max-width:90ch}
.strip-note b{font-weight:700}

/* controls */
.ctrls{display:flex;flex-wrap:wrap;gap:12px 20px;margin-bottom:14px;align-items:end;padding-bottom:12px;border-bottom:1px dashed var(--rule)}
.ctl{display:grid;gap:4px;min-width:0}
.ctl>span{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.ctl.locked>span::after{content:" · fixed";color:var(--warn)}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:6px;overflow:hidden;flex-wrap:wrap;max-width:100%}
.seg button{border:0;border-right:1px solid var(--rule);background:var(--panel-2);padding:5px 9px;font-size:12.5px;font-family:var(--mono);line-height:1.25}
.seg button:last-child{border-right:0}
.seg button small{display:block;font-size:10px;color:var(--muted);font-weight:400}
.seg button.on{background:var(--sea);color:var(--sea-ink);font-weight:600}
.seg button.on small{color:inherit;opacity:.85}
.seg button:disabled{cursor:not-allowed;opacity:.5}
.seg button.on:disabled{opacity:1}
select{font:inherit;font-family:var(--mono);font-size:12.5px;background:var(--panel-2);color:var(--ink);border:1px solid var(--rule);border-radius:6px;padding:6px 8px}
select:disabled{opacity:.6}
.range{display:flex;align-items:center;gap:8px}
.range input{width:170px;accent-color:var(--sea)}
.range output{font-family:var(--mono);font-size:13px;font-weight:600;min-width:3ch;font-variant-numeric:tabular-nums}

/* world 1 sim */
.simgrid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px}
.chipwrap svg{width:100%;height:auto;display:block}
.pkg{fill:var(--pkg);stroke:var(--pkg-edge);stroke-width:2}
.die{fill:var(--die);stroke:var(--die-edge);stroke-width:1.5;cursor:pointer}
.sm{fill:var(--sm-off);cursor:pointer;transition:fill .25s}
.sm.on{fill:var(--sm-on)}
.sm.dis{fill:var(--sm-dis);cursor:default}
.stack{cursor:pointer}
.stack .shell{fill:var(--hbm);stroke:var(--pkg-edge);stroke-width:1}
.stack .fill{fill:var(--hbm-fill)}
.stack.oom .fill{fill:var(--bad)}
.stack.dummy .shell{fill:none;stroke:var(--hbm);stroke-dasharray:3 3}
.stack:hover .shell,.die:hover{stroke:var(--signal)}
.lane{stroke:var(--lane);stroke-width:5;stroke-dasharray:3 7;stroke-linecap:round;fill:none;cursor:pointer;animation:flow var(--dur,1.2s) linear infinite}
.lane.idle{animation:none;opacity:.25}
@keyframes flow{to{stroke-dashoffset:-20}}
.linkbar{fill:var(--signal);cursor:pointer}
.chiplbl{font-family:var(--mono);font-size:11px;fill:var(--ink)}
.chiplbl.dim{fill:var(--muted)}
.dielbl{font-family:var(--mono);font-size:10px;fill:var(--die-ink,#DCE8E3)}
.stklbl{font-family:var(--mono);font-size:10px;fill:#fff;pointer-events:none}
.inspect{font-size:13.5px;background:var(--panel-2);border:1px solid var(--rule);border-radius:8px;padding:10px 12px;margin-top:8px}
.inspect>b:first-child{display:block;margin-bottom:2px}
.inspect .tip{color:var(--muted)}
.sec-h{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 6px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.sec-h b{color:var(--ink);font-weight:600;letter-spacing:0;text-transform:none;font-size:12px}
.side{display:grid;gap:14px;align-content:start;min-width:0}
.membar{display:flex;height:24px;border-radius:4px;overflow:hidden;border:1px solid var(--rule);background:var(--panel-2);position:relative}
.membar span{display:block;height:100%;flex:none}
.membar .w{background:var(--wt)} .membar .k{background:var(--kv)} .membar .r{background:var(--rsv)}
.membar .x{background:repeating-linear-gradient(135deg,var(--bad) 0 6px,color-mix(in srgb,var(--bad) 60%,transparent) 6px 12px)}
.memleg{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:6px;font-variant-numeric:tabular-nums}
.memleg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.memstat{font-size:13px;margin-top:4px}
.memstat.bad{color:var(--bad);font-weight:700}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:8px}
.tile{background:var(--panel-2);border:1px solid var(--rule);border-radius:6px;padding:8px 10px;min-width:0}
.tile .k{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tile .v{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .s{font-size:12px;color:var(--muted);line-height:1.3}
.tile.flag{border-color:var(--bad)} .tile.flag .v{color:var(--bad)}
.pill{display:inline-block;font-family:var(--mono);font-size:11px;padding:2px 8px;border-radius:3px;background:var(--panel-2);border:1px solid var(--rule);font-weight:600}
.pill.mem{background:var(--sea);color:var(--sea-ink);border-color:var(--sea)}
.pill.cmp{background:var(--signal);color:var(--signal-ink);border-color:var(--signal)}
.pill.bad{background:var(--bad);color:#fff;border-color:var(--bad)}
.pill.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.meters{display:grid;gap:8px}
.meter{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;font-size:12.5px}
.meter .bar{grid-column:1/-1;height:8px;background:var(--panel-2);border:1px solid var(--rule);border-radius:4px;overflow:hidden}
.meter .bar span{display:block;height:100%;background:var(--sea);transition:width .4s}
.meter.t .bar span{background:var(--signal)}
.meter b{font-family:var(--mono);font-variant-numeric:tabular-nums}
.quality{font-size:13px}
.quality .pill{margin-right:6px}

.roofsec{margin-top:16px;padding-top:12px;border-top:1px dashed var(--rule)}
.roofsec svg{width:100%;height:auto;display:block;max-width:760px;min-width:520px}
.side .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
.ax{stroke:var(--rule);stroke-width:1}
.axt{font-family:var(--mono);font-size:10px;fill:var(--muted)}
.roof{stroke:var(--ink);stroke-width:2.5;fill:none}
.ridge{stroke:var(--muted);stroke-dasharray:4 4}
.pt-dec{fill:var(--sea);stroke:var(--panel);stroke-width:2}
.pt-pre{fill:var(--signal);stroke:var(--panel);stroke-width:2}
.ptl{font-family:var(--mono);font-size:11px;fill:var(--ink);font-weight:600}
.zone{font-family:var(--body);font-size:11px;fill:var(--muted);font-style:italic}

/* world 2 sim */
.stackdiag{display:grid;gap:6px}
.srow{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:stretch;text-align:left;background:var(--panel-2);border:1px solid var(--rule);border-radius:8px;padding:8px 10px;width:100%;transition:border-color .2s,background .2s}
.srow:hover{border-color:var(--sea)}
.srow .i{font-family:var(--display);font-size:22px;color:var(--sea);line-height:1}
.srow .nm{font-weight:700;font-size:14.5px}
.srow .tg{font-size:12px;color:var(--muted);margin-left:6px;font-weight:400}
.srow code{display:block;white-space:pre-wrap;word-break:break-word;margin-top:4px;font-size:11.5px;background:transparent;border:0;padding:0;color:var(--muted)}
.srow .lyr{font-family:var(--mono);font-size:10px;color:var(--sea);float:right;margin-left:8px}
.srow.lit{border-color:var(--signal);background:color-mix(in srgb,var(--signal) 16%,var(--panel-2))}
.srow.seen .i{color:var(--ok)}
.srow.boundary{margin-top:6px;border-top:3px double var(--rule)}
.tlwrap{overflow-x:auto}
.tlwrap svg{width:100%;min-width:560px;height:auto;display:block}
